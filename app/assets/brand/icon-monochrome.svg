<?xml version="1.0" encoding="UTF-8"?>
<!--
  EyeSense — monochrome layer for Android 13+ themed icons.

  The system tints this layer to the user's wallpaper palette and discards
  colour, so every element is the same flat value with no gradients and no
  second tone. Geometry is identical to icon-adaptive-foreground.svg.

  Artwork confined to the central 66 dp safe zone of a 108 dp canvas.
  When converting to an Android vector drawable, keep it one colour and let
  the system handle tinting; do not bake in a tint here.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108"
     role="img" aria-label="EyeSense">
  <title>EyeSense</title>
  <g transform="translate(27, 27) scale(0.84)">
    <g fill="none" stroke="#000000" stroke-width="5.5" stroke-linecap="round">
      <path d="M 28.23 20.67 A 14 14 0 0 1 28.23 43.33"/>
      <path d="M 32.93 14.20 A 22 22 0 0 1 32.93 49.80"/>
      <path d="M 37.63 7.73  A 30 30 0 0 1 37.63 56.27"/>
    </g>
    <circle cx="20" cy="32" r="6.5" fill="#000000"/>
  </g>
</svg>
