<?xml version="1.0" encoding="UTF-8"?>
<!--
  EyeSense  primary horizontal lockup. Mark + wordmark.
  Use for the Flutter bootstrap/splash screen, headers, docs and pitch material.

  Wordmark is set in Atkinson Hyperlegible Bold, the same family the app UI uses.
  "Eye" in textPrimary, "Sense" in accent.

  IMPORTANT: this file uses a live <text> element so it stays editable.
  Before distributing outside the app (web, print, store listing), convert the
  text to outlines so rendering does not depend on the font being installed.

  Clear space: keep at least 12 px (one dot diameter at this scale) clear on
  all sides. Minimum width: 120 px.

  Dark background variant as-is. For light backgrounds, swap:
    #F7F8F8 -> #14171D   (wordmark "Eye")
    #FFC247 -> #8A5A00   (mark and "Sense")
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 64" width="252" height="64"
     role="img" aria-label="EyeSense">
  <title>EyeSense</title>

  <!-- Mark -->
  <g fill="none" stroke="#FFC247" stroke-width="5" stroke-linecap="round">
    <path d="M 28.23 20.67 A 14 14 0 0 1 28.23 43.33"/>
    <path d="M 32.93 14.20 A 22 22 0 0 1 32.93 49.80"/>
    <path d="M 37.63 7.73  A 30 30 0 0 1 37.63 56.27"/>
  </g>
  <circle cx="20" cy="32" r="6" fill="#FFC247"/>

  <!-- Wordmark -->
  <text x="78" y="45"
        font-family="Atkinson Hyperlegible, Atkinson Hyperlegible Next, Inter, Segoe UI, sans-serif"
        font-size="36" font-weight="700" letter-spacing="-0.18">
    <tspan fill="#F7F8F8">Eye</tspan><tspan fill="#FFC247">Sense</tspan>
  </text>
</svg>
