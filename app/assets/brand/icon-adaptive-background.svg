<!--
  EyeSense  Android adaptive icon BACKGROUND layer.
  Flat ink fill. No gradient, no texture, no inner shape: the system applies
  its own mask and any detail here will be cropped unpredictably across OEMs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <rect width="108" height="108" fill="#0A0C10"/>
</svg>
