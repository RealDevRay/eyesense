<?xml version="1.0" encoding="UTF-8"?>
<!--
  EyeSense  mark only.
  Concept: light in, speech out. A solid lens disc with three arcs of
  increasing radius opening to the right, reading as both an aperture and
  an audio emanation. Deliberately not an eyeball.

  Colours: accent #FFC247 on ink #0A0C10 (dark) or accent #8A5A00 (light).
  Set `fill`/`stroke` to `currentColor` if you need it to inherit.
  Minimum size: 24 px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="EyeSense">
  <title>EyeSense</title>
  <g fill="none" stroke="#FFC247" stroke-width="5" stroke-linecap="round">
    <path d="M 28.23 20.67 A 14 14 0 0 1 28.23 43.33"/>
    <path d="M 32.93 14.20 A 22 22 0 0 1 32.93 49.80"/>
    <path d="M 37.63 7.73  A 30 30 0 0 1 37.63 56.27"/>
  </g>
  <circle cx="20" cy="32" r="6" fill="#FFC247"/>
</svg>
