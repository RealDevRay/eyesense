<?xml version="1.0" encoding="UTF-8"?>
<!--
  EyeSense  Android adaptive icon FOREGROUND layer.

  Canvas is 108 x 108 dp as Android requires. The system may mask anything
  outside the central 72 dp circle and will apply its own shape, so all
  artwork is confined to the central 66 dp safe zone.

  Pair with a solid background layer of #0A0C10 (see icon-adaptive-background.svg).
  Mark only  never the wordmark. Text is illegible at launcher size.

  Generate the raster layers with flutter_launcher_icons.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108"
     role="img" aria-label="EyeSense">
  <title>EyeSense</title>

  <!-- Safe-zone guide: delete before export. Central 66 dp. -->
  <!-- <circle cx="54" cy="54" r="33" fill="none" stroke="#FF00FF" stroke-width="0.5"/> -->

  <!-- Mark scaled to a 54 dp box and centred, leaving generous breathing room -->
  <g transform="translate(27, 27) scale(0.84)">
    <g fill="none" stroke="#FFC247" stroke-width="5.5" stroke-linecap="round">
      <path d="M 28.23 20.67 A 14 14 0 0 1 28.23 43.33"/>
      <path d="M 32.93 14.20 A 22 22 0 0 1 32.93 49.80"/>
      <path d="M 37.63 7.73  A 30 30 0 0 1 37.63 56.27"/>
    </g>
    <circle cx="20" cy="32" r="6.5" fill="#FFC247"/>
  </g>
</svg>
